name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install uv
      run: pip install uv

    - name: Install dependencies
      shell: bash
      run: uv pip install --system qwen-tts torch torchaudio soundfile numpy librosa PyQt5 requests pyinstaller scipy

    - name: Obfuscate Source Code with PyArmor
      shell: bash
      run: |
        uv pip install --system pyarmor
        # Obfuscate từng file riêng, GIỮ NGUYÊN cấu trúc package license/
        # để relative imports (.checker, .device_id, .firebase_config) không bị phá vỡ
        pyarmor gen -O dist/obf gwen_tts_gui.py inference.py text_normalizer.py
        pyarmor gen -O dist/obf/license license/__init__.py license/checker.py license/device_id.py license/firebase_config.py license/login_dialog.py

    - name: Build App with PyInstaller
      shell: bash
      run: |
        cp -r data dist/obf/data
        cd dist/obf
        pyinstaller --name "Gwen-TTS" --windowed \
          --add-data "data;data" \
          --hidden-import inference \
          --hidden-import text_normalizer \
          --collect-all qwen_tts \
          --collect-all torch \
          --collect-all torchaudio \
          --collect-all transformers \
          --collect-all librosa \
          --collect-all soundfile \
          --hidden-import PyQt5 \
          --hidden-import PyQt5.QtWidgets \
          --hidden-import PyQt5.QtCore \
          --hidden-import PyQt5.QtGui \
          --hidden-import telegram \
          --hidden-import license \
          --hidden-import license.checker \
          --hidden-import license.device_id \
          --hidden-import license.firebase_config \
          --hidden-import license.login_dialog \
          --hidden-import scipy \
          --hidden-import scipy.signal \
          --hidden-import urllib.request \
          --hidden-import urllib.error \
          --hidden-import uuid \
          --hidden-import hashlib \
          --hidden-import platform \
          --hidden-import subprocess \
          --paths . \
          -y gwen_tts_gui.py

    - name: Upload Windows App Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Gwen-TTS-Windows-App
        path: dist/obf/dist/Gwen-TTS/
